name: Gerar aplicativos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar credencial Google OAuth
        shell: pwsh
        env:
          GOOGLE_OAUTH_DESKTOP_B64: ${{ secrets.GOOGLE_OAUTH_DESKTOP_B64 }}
        run: |
          New-Item -ItemType Directory -Path secrets -Force | Out-Null
          $raw = $env:GOOGLE_OAUTH_DESKTOP_B64.Trim()
          if ($raw.StartsWith('{')) {
            [IO.File]::WriteAllText('secrets/google-oauth-desktop.json', $raw, [Text.UTF8Encoding]::new($false))
          } else {
            [IO.File]::WriteAllBytes('secrets/google-oauth-desktop.json', [Convert]::FromBase64String($raw))
          }
      - run: npm test
      - run: npm run dist:win -- --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-Windows
          path: |
            outputs/dist/*Setup*.exe
            outputs/dist/*Portable*.exe
      - name: Publicar instaladores na versão
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG (Get-ChildItem outputs/dist/*.exe | ForEach-Object FullName) --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.0' }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar credencial Google OAuth
        env:
          GOOGLE_OAUTH_DESKTOP_B64: ${{ secrets.GOOGLE_OAUTH_DESKTOP_B64 }}
        run: |
          mkdir -p secrets
          case "$GOOGLE_OAUTH_DESKTOP_B64" in
            {*) printf '%s' "$GOOGLE_OAUTH_DESKTOP_B64" > secrets/google-oauth-desktop.json ;;
            *) printf '%s' "$GOOGLE_OAUTH_DESKTOP_B64" | tr -d '\r\n ' | base64 --decode > secrets/google-oauth-desktop.json ;;
          esac
      - name: Restaurar permissão do 7-Zip
        run: chmod +x node_modules/7zip-bin/mac/*/7za Abrir-no-macOS.command
      - run: npm test
      - run: npm run dist:mac -- --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-macOS
          path: |
            outputs/dist/*.dmg
            outputs/dist/*.zip
            Abrir-no-macOS.command
      - name: Publicar instaladores na versão
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload "$RELEASE_TAG" outputs/dist/*.dmg outputs/dist/*.zip Abrir-no-macOS.command --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.0' }}
