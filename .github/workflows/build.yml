name: Gerar aplicativos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-Windows
          path: |
            outputs/dist/*Setup*.exe
            outputs/dist/*Portable*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restaurar permissão do 7-Zip
        run: chmod +x node_modules/7zip-bin/mac/*/7za
      - run: npm test
      - run: npm run dist:mac -- --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-macOS
          path: |
            outputs/dist/*.dmg
            outputs/dist/*.zip
