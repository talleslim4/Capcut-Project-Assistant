name: Gerar aplicativos

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-Windows
          path: |
            outputs/dist/*Setup*.exe
            outputs/dist/*Portable*.exe
      - name: Publicar instaladores na versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem outputs/dist/*.exe | ForEach-Object FullName) --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restaurar permissão do 7-Zip
        run: chmod +x node_modules/7zip-bin/mac/*/7za Abrir-no-macOS.command
      - run: npm test
      - run: npm run dist:mac -- --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CapCut-Project-Assistant-macOS
          path: |
            outputs/dist/*.dmg
            outputs/dist/*.zip
            Abrir-no-macOS.command
      - name: Publicar instaladores na versão
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" outputs/dist/*.dmg outputs/dist/*.zip Abrir-no-macOS.command --clobber
        env:
          GH_TOKEN: ${{ github.token }}
